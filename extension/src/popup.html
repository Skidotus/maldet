<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MalDet</title>
  <link rel="icon" type="image/png" href="icons/icon32.png">
  <style>
    :root { color-scheme: light dark; }

    /* Serves as the toolbar popup and as the full options page. A popup
       sizes itself to its content, so min-width is what stops it rendering
       as a sliver; max-width keeps it readable when opened in a tab. */
    body {
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-width: 300px; max-width: 360px; margin: 0; padding: 14px 16px 16px;
      background: #fbfaf7; color: #1b2a22;
    }

    .brand { display: flex; align-items: center; gap: 7px; margin-bottom: 14px; }
    .brand img { width: 20px; height: 20px; }
    .brand span { font-weight: 700; letter-spacing: -0.01em; }

    /* --- the part that matters: what is on screen right now --- */
    .repo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 13px; font-weight: 600; word-break: break-all; margin: 0 0 2px; }
    .status { margin: 0 0 12px; font-size: 12.5px; color: #5d6b63; }
    .status.stale { color: #8a6d1f; font-weight: 600; }
    .status.warn  { color: #8a3a2f; font-weight: 600; }

    /* --- the verdict block --- */
    .meta { margin: 0 0 11px; font-size: 11.5px; color: #5d6b63; }
    .meta span + span::before { content: " \00B7 "; }

    .verdict {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 11px; margin: 0 0 10px; border-radius: 6px;
      border: 1px solid; font-weight: 700;
    }
    .verdict__level { font-size: 11.5px; letter-spacing: 0.07em; text-transform: uppercase; }
    .verdict__score { font-size: 15px; font-variant-numeric: tabular-nums; }

    /* Five steps, matching the site's own scale. Scores are unbounded, so
       the band carries the meaning and the number is only detail. */
    .lv-safe     { border-color: #2f6b4f; background: #f0f8f3; color: #1d4733; }
    .lv-low      { border-color: #4e8f69; background: #f2f8f4; color: #23523a; }
    .lv-medium   { border-color: #8a6d1f; background: #fdf8ec; color: #6b5316; }
    .lv-high     { border-color: #a35a28; background: #fdf3ec; color: #7d4420; }
    .lv-critical { border-color: #8a3a2f; background: #fdf1ef; color: #7a2f26; }

    .tracks { margin: 0 0 9px; }
    .track {
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 12px; padding: 3px 0;
    }
    .track__name { color: #5d6b63; }
    .track__val { font-weight: 600; font-variant-numeric: tabular-nums; }
    .track__val em { font-style: normal; color: #5d6b63; font-weight: 400; margin-left: 5px; }

    .counts { margin: 0 0 12px; font-size: 11.5px; color: #5d6b63;
              font-variant-numeric: tabular-nums; }

    .actions { display: flex; flex-direction: column; gap: 7px; }
    .btn {
      display: block; width: 100%; box-sizing: border-box; text-align: center;
      padding: 8px 12px; font: inherit; font-weight: 600; font-size: 13px;
      border-radius: 6px; cursor: pointer; text-decoration: none;
      border: 1px solid #1d4733;
    }
    .btn--primary { background: #0a1d15; color: #a3d9b8; }
    .btn--primary:hover { background: #11301f; }
    .btn--ghost { background: transparent; color: #1d4733; }
    .btn--ghost:hover { background: #eef3ef; }

    .empty { color: #5d6b63; font-size: 13px; margin: 0 0 12px; }

    @media (prefers-color-scheme: dark) {
      body { background: #11150f; color: #e6ece8; }
      .hint, .status, .empty, .meta, .counts,
      .track__name, .track__val em { color: #9bab9f; }
      .lv-safe     { border-color: #2f6b4f; background: #11261a; color: #a3d9b8; }
      .lv-low      { border-color: #2f6b4f; background: #10231a; color: #9ccfb3; }
      .lv-medium   { border-color: #8a6d1f; background: #2a2007; color: #e3c168; }
      .lv-high     { border-color: #a35a28; background: #2b1709; color: #e8ab74; }
      .lv-critical { border-color: #8a3a2f; background: #2a110d; color: #e39a8f; }
      .status.stale { color: #e3c168; }
      .status.warn  { color: #e39a8f; }
      .btn--ghost { color: #a3d9b8; border-color: #2f6b4f; }
      .btn--ghost:hover { background: #1a211b; }
      .btn--primary { border-color: #2f6b4f; }
    }
  </style>
</head>
<body>
  <div class="brand">
    <img src="icons/icon32.png" alt="">
    <span>MalDet</span>
  </div>

  <!-- Filled in by popup.js from whatever tab is in front. -->
  <div id="context">
    <p class="empty" id="loading">Checking this page…</p>
  </div>


  <script src="repo.js"></script>
  <script src="popup.js"></script>
</body>
</html>
